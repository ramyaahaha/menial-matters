---
layout: default
---
<article class="article">
  <h2 class="post-title">{{ page.title }}</h2>

  {% if page.image %}
    {% if page.image contains '://' %}
      {% assign img = page.image %}
    {% else %}
      {% assign img = page.image | relative_url %}
    {% endif %}
    <img class="post-image" src="{{ img }}" alt="{{ page.image_alt | escape }}">
  {% endif %}

  <div class="post-body">
    {{ content }}
  </div>
</article>
<p class="back"><a href="{{ '/' | relative_url }}">Back to other menial matters</a></p>
